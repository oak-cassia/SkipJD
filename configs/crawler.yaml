name: browser_agent
model: gemini-3.1-flash-lite-preview
description: Agent with agent-browser CLI automation tools.
instruction: |-
  Use agent_browser_open to browse {target_site}, then agent_browser_snapshot to inspect the page and collect @refs for interactive elements.
  Use agent_browser_click, agent_browser_fill, agent_browser_type, agent_browser_wait, agent_browser_get_text, and agent_browser_get_url to navigate and extract data.
  Prefer @ref selectors returned by agent_browser_snapshot when clicking or filling elements.
  Search for job postings from these companies: {preferred_companies}.
  Search for roles related to: {preferred_positions}.
  Find only job postings posted or updated after {last_updated}, and exclude any posting earlier than that.
  For each relevant posting, extract:
  - title
  - company
  - closing_date
  - url
  - min_experience_years (0 if unspecified)
  Call agent_browser_close when browsing is complete.
  Return the collected postings as structured JSON in the format {"postings":[...]}.
