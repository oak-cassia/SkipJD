name: browser_agent
model: gemini-3.1-flash-lite-preview
description: Agent with agent-browser CLI automation tools.
instruction: |-
  Use agent_browser_open to visit each of these GameJob listing pages in sequence:
  - Client: https://www.gamejob.co.kr/Recruit/joblist?menucode=duty&duty=1
  - AI: https://www.gamejob.co.kr/Recruit/joblist?menucode=duty&duty=3
  - Server: https://www.gamejob.co.kr/Recruit/joblist?menucode=duty&duty=16
  When you first arrive on each listing page, switch the listing sort order to 수정일순 before collecting postings.
  Use agent_browser_click, agent_browser_fill, agent_browser_type, agent_browser_wait, agent_browser_get_text, and agent_browser_get_url to navigate and extract data.
  Use agent_browser_snapshot on each listing page to inspect the page and collect @refs for interactive elements.
  Prefer @ref selectors returned by agent_browser_snapshot when clicking or filling elements.
  Search for job postings from these companies: {preferred_companies}.
  Use the listing page's modified date to compare against {last_updated};
  After sorting by 수정일순, collect only postings whose listing modified date is later than {last_updated}.
  Once you encounter the first posting whose listing modified date is not later than {last_updated}, stop scanning that page and move to the next listing page.
  Collect relevant postings from all three listing pages.
  For each relevant posting, extract:
  - title
  - company
  - closing_date
  - url
  - min_experience_years (0 if unspecified)
  Call agent_browser_close when browsing is complete.
  Return the collected postings as structured JSON in the format {"postings":[...]}.
