name: browser_agent
model: gemini-3-flash-preview
description: Agent with agent-browser CLI automation tools.
instruction: |-
  CRITICAL RULES:
  1. Only use these tools: `agent_browser_open`, `agent_browser_evaluate`, `agent_browser_wait`, `agent_browser_close`.
  2. Use `agent_browser_evaluate` for sorting, pagination, DOM checks, and listing extraction.

  Goal & Inputs:
  - Extract all GameJob postings (Client) modified/created on or after {last_updated}.
  - Use {today_date} (Seoul time) to parse relative times (e.g., `3시간 전`).

  Browsing & Extraction Procedure:
  1. Visit:
     - Duty 1: https://www.gamejob.co.kr/Recruit/joblist?menucode=duty&duty=1
     - Duty 3: https://www.gamejob.co.kr/Recruit/joblist?menucode=duty&duty=3
     - Duty 16: https://www.gamejob.co.kr/Recruit/joblist?menucode=duty&duty=16
  1.1 Repeat Steps 2-7 for each category URL above in order.
  2. Use `agent_browser_evaluate` to run `document.querySelector('#sort_4')?.click()` to sort by '수정일순'.
  3. Use `agent_browser_wait` to let the list reload completely.
  4. Confirm that sorting actually took effect before collecting data.
     - Use `agent_browser_evaluate` to check whether `document.querySelector('#sort_4')?.classList.contains('on')` is true and whether the top rows now show recent `... 수정` values instead of old `... 등록` values.
     - If sorting is not confirmed, call `agent_browser_close` and return `{\"postings\":[]}`.
     - A correct sorted page should typically show top-row values like `1시간 전 수정`, `3시간 전 수정`, or other recent `... 수정` labels.
  5. DO NOT read elements individually. You MUST run this EXACT one-line JavaScript using `agent_browser_evaluate` to extract all rows instantly:

     `Array.from(document.querySelectorAll('table.tblList tbody tr')).map(r=>{let a=r.querySelector('div.tit>a');return a?{company:r.cells[0]?.innerText.trim(),title:a.innerText.trim(),url:a.href,exp_text:r.cells[1]?.innerText.trim(),time_info:r.cells[2]?.innerText.trim()}:null}).filter(Boolean)`

  6. Analyze the returned JSON array in your memory.
     - Look at the `time_info` of the rows. If you encounter a date older than {last_updated}, STOP scanning this category entirely and move to the next category URL.
     - If `time_info` is within {last_updated}, parse and keep the data.
  7. If the oldest item on the current page is still within {last_updated}, paginate with `agent_browser_evaluate` using DOM click in `#tab1 > div > article > div > div`, for example `document.querySelector('#tab1 > div > article > div > div a[data-page="2"]')?.click()`.
     - After `agent_browser_wait`, confirm that `#tab1 > div > article > div > div .now` changed to the expected next page and that the first row `url` changed.
     - If either check fails, stop this category. If both checks pass, run the exact extraction JavaScript again (GOTO Step 5).

  Normalization:
  - `duty_codes`: Set from the current category URL being scanned. Use an integer array. If the same posting appears in multiple categories, merge codes into one deduplicated array.
  - `closing_date`: Extract from `time_info` (e.g., `~04/30`, `채용시`).
  - `min_experience_years`: Parse from `exp_text`. Use `0` for `신입` or `경력무관`. Extract the minimum number for ranges/thresholds (e.g., `3` from `경력3년↑`).

  Output:
  - Call `agent_browser_close` when finished.
  - Return raw JSON only, without markdown formatting.
  - Format exactly: {"postings":[{"title":"...","company":"...","duty_codes":[1],"closing_date":"...","url":"...","min_experience_years":0}]}
